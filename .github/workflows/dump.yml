name: Dump

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p w
          gh release download base --repo "$GITHUB_REPOSITORY" --pattern "com.dts.freefireth*.ipa" --dir w --clobber
          f=$(ls w/com.dts.freefireth*.ipa | head -1)
          mv "$f" w/base.ipa
          unzip -q w/base.ipa -d w/app
          APP=$(ls -d w/app/Payload/*.app | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          ls -la "$APP/Frameworks/UnityFramework.framework/" | head -5
          ls -la "$APP/Data/Managed/Metadata/" | head -5

      - name: Dumper
        run: |
          git clone --depth 1 https://github.com/tien0246/Il2CppDumper-Free-Fire.git d || echo "CLONE FALLO"
          cd d
          ls -la
          dotnet build -c Release 2>&1 | tail -30 || echo "BUILD FALLO"
          echo "--- dlls encontradas ---"
          find . -name "*.dll" -path "*bin*" | head -20
          find . -iname "*il2cpp*" | head -20

      - name: Config
        run: |
          cat > d/config.json <<'EOF'
          {
            "DumpMethod": false,
            "DumpField": true,
            "DumpProperty": false,
            "DumpAttribute": false,
            "DumpFieldOffset": true,
            "DumpMethodOffset": false,
            "DumpTypeDefIndex": true,
            "GenerateDummyDll": false,
            "GenerateStruct": false,
            "RequireAnyKey": false,
            "ForceDump": false
          }
          EOF
          echo "config escrito"

      - name: Run
        run: |
          EXE=$(find d -name "Il2CppDumper.dll" | head -1)
          echo "EXE=[$EXE]"
          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          META="$APP/Data/Managed/Metadata/global-metadata.dat"
          echo "UF=[$UF]"
          echo "META=[$META]"
          ls -la "$UF" "$META"
          mkdir -p out
          if [ -n "$EXE" ]; then
            dotnet "$EXE" "$UF" "$META" out 2>&1 | tail -40 || echo "DUMPER ERROR"
          else
            echo "NO HAY DLL DEL DUMPER"
          fi
          echo "--- salida ---"
          ls -la out || true
          find . -maxdepth 3 -name "dump.cs" | head

      - name: Extracto
        run: |
          python3 - <<'PY'
          import os, glob
          p = 'out/dump.cs'
          if not os.path.exists(p):
              print("SIN dump.cs")
              for f in glob.glob('**/dump.cs', recursive=True):
                  print("encontrado en:", f)
                  p = f
                  break
          if not os.path.exists(p):
              print("nada que extraer"); raise SystemExit
          s = open(p, encoding='utf-8', errors='ignore').read()
          lines = s.splitlines()
          print("LINEAS TOTAL", len(lines))
          res = []
          for kw in ["class Player", "class GameFacade", "class MatchGame", "JMAGGLCNGIG"]:
              hits = [i for i, l in enumerate(lines) if kw in l]
              res.append("\n=== %s (%d) ===" % (kw, len(hits)))
              for i in hits[:2]:
                  res.append("\n".join(lines[i:i+90]))
          print("\n".join(res)[:70000])
          PY
