name: Dump

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p w
          gh release download base --repo "$GITHUB_REPOSITORY" --pattern "com.dts.freefireth*.ipa" --dir w --clobber
          f=$(ls w/com.dts.freefireth*.ipa | head -1)
          mv "$f" w/base.ipa
          unzip -q w/base.ipa -d w/app
          APP=$(ls -d w/app/Payload/*.app | head -1)
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Dumper
        run: |
          git clone --depth 1 https://github.com/Perfare/Il2CppDumper.git d
          cd d
          dotnet build -c Release 2>&1 | tail -8

      - name: Run
        run: |
          OUTDIR="d/Il2CppDumper/bin/Release/net6.0"
          cat > "$OUTDIR/config.json" <<'EOF'
          {
            "DumpMethod": false,
            "DumpField": true,
            "DumpProperty": false,
            "DumpAttribute": false,
            "DumpFieldOffset": true,
            "DumpMethodOffset": false,
            "DumpTypeDefIndex": true,
            "GenerateDummyDll": false,
            "GenerateStruct": false,
            "RequireAnyKey": false,
            "ForceDump": false
          }
          EOF
          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          META="$APP/Data/Managed/Metadata/global-metadata.dat"
          mkdir -p out
          dotnet "$OUTDIR/Il2CppDumper.dll" "$UF" "$META" out 2>&1 | tail -10

      - name: Player
        run: |
          python3 - <<'PY'
          s = open('out/dump.cs', encoding='utf-8', errors='ignore').read().splitlines()
          hits = [i for i, l in enumerate(s) if 'TypeDefIndex: 31767' in l]
          print("HITS PLAYER", hits[:3])
          for i in hits[:1]:
              print("\n".join(s[max(0,i-3):i+170]))
          PY

      - name: Match
        run: |
          python3 - <<'PY'
          s = open('out/dump.cs', encoding='utf-8', errors='ignore').read().splitlines()
          hits = [i for i, l in enumerate(s) if 'TypeDefIndex: 32076' in l]
          print("HITS MATCH", hits[:3])
          for i in hits[:1]:
              print("\n".join(s[max(0,i-3):i+200]))
          PY

      - name: Listas
        run: |
          python3 - <<'PY'
          s = open('out/dump.cs', encoding='utf-8', errors='ignore').read().splitlines()
          for i, l in enumerate(s):
              if 'List<Player>' in l or 'List<BEADLMGGGGL>' in l or 'OriginalNickName' in l:
                  print("%d| %s" % (i, l.strip()))
          PY
