name: Dump

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p w
          gh release download base --repo "$GITHUB_REPOSITORY" --pattern "com.dts.freefireth*.ipa" --dir w --clobber
          f=$(ls w/com.dts.freefireth*.ipa | head -1)
          mv "$f" w/base.ipa
          unzip -q w/base.ipa -d w/app
          APP=$(ls -d w/app/Payload/*.app | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          ls -la "$APP/Frameworks/UnityFramework.framework/" | head -5
          ls -la "$APP/Data/Managed/Metadata/" | head -5

      - name: Dumper
        run: |
          git clone --depth 1 https://github.com/tien0246/Il2CppDumper-Free-Fire.git d
          cd d
          dotnet build -c Release 2>&1 | tail -15
          ls -la Il2CppDumper/bin/Release/net6.0/ | head -20

      - name: Run
        run: |
          set -x
          OUTDIR="d/Il2CppDumper/bin/Release/net6.0"
          EXE="$OUTDIR/Il2CppDumper.dll"
          if [ ! -f "$EXE" ]; then
            EXE=$(find . -name "Il2CppDumper.dll" | head -1)
            OUTDIR=$(dirname "$EXE")
          fi
          echo "EXE=[$EXE]"

          cat > "$OUTDIR/config.json" <<'EOF'
          {
            "DumpMethod": false,
            "DumpField": true,
            "DumpProperty": false,
            "DumpAttribute": false,
            "DumpFieldOffset": true,
            "DumpMethodOffset": false,
            "DumpTypeDefIndex": true,
            "GenerateDummyDll": false,
            "GenerateStruct": false,
            "RequireAnyKey": false,
            "ForceDump": false
          }
          EOF

          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          META="$APP/Data/Managed/Metadata/global-metadata.dat"
          echo "UF=[$UF]"
          echo "META=[$META]"
          ls -la "$UF" "$META" || true

          mkdir -p out
          dotnet "$EXE" "$UF" "$META" out 2>&1 | tail -60 || true

          echo "--- salida ---"
          ls -la out || true
          find . -name "dump.cs" -not -path "./d/*" | head

      - name: Extracto
        run: |
          python3 - <<'PY'
          import os, glob
          p = 'out/dump.cs'
          if not os.path.exists(p):
              print("SIN dump.cs")
              for f in glob.glob('**/dump.cs', recursive=True):
                  print("encontrado en:", f); p = f; break
          if not os.path.exists(p):
              print("nada que extraer"); raise SystemExit
          s = open(p, encoding='utf-8', errors='ignore').read()
          lines = s.splitlines()
          print("LINEAS TOTAL", len(lines))
          res = []
          for kw in ["class Player", "class GameFacade", "class MatchGame", "JMAGGLCNGIG"]:
              hits = [i for i, l in enumerate(lines) if kw in l]
              res.append("\n=== %s (%d) ===" % (kw, len(hits)))
              for i in hits[:2]:
                  res.append("\n".join(lines[i:i+90]))
          print("\n".join(res)[:70000])
          PY
