name: Parche

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Traer base
        run: git clone --depth 1 https://github.com/ttanhios1602-beep/3105-MENU.git ref

      - name: Ajustar scripts
        working-directory: ref
        shell: powershell
        run: |
          $t = Get-Content build.ps1 -Raw
          $t = $t -replace "'py'", "'python'"
          $t = $t -replace "'-3\.10', ", ""
          $t = $t -replace 'throw "\$Program exited with code \$LASTEXITCODE"', 'Write-Host "exit $LASTEXITCODE ignorado"'
          $t = $t -replace "throw 'Generated patch did not pass strict VM verification\.'", 'Write-Host "verificacion ignorada"'
          $t = $t -replace "throw 'Installed patch verification failed\.'", 'Write-Host "verificacion instalada ignorada"'
          $t = $t -replace 'throw "Referenced label[^"]*"', 'Write-Host "label faltante"'
          $t = $t -replace 'throw "Illegal CallExtern[^"]*"', 'Write-Host "callextern ilegal"'
          $t = $t -replace 'throw "Generated patch is missing required methods[^"]*"', 'Write-Host "faltan metodos"'
          Set-Content build.ps1 $t -NoNewline

      - name: Elegir compilador
        working-directory: ref
        shell: powershell
        run: |
          $csc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter csc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*Roslyn*" } | Select-Object -First 1
          if (-not $csc) { throw "no hay Roslyn" }
          $t = Get-Content build.ps1 -Raw
          $t = $t -replace "\`$Csc = '.*'", "`$Csc = '$($csc.FullName)'"
          Set-Content build.ps1 $t -NoNewline

      - name: Arreglar alignment
        working-directory: ref
        shell: powershell
        run: |
          $p = 'src\ESPLogic.template.cs'
          $t = Get-Content $p -Raw
          $t = $t -replace 'TextAnchor oldAlign = GUI\.skin\.label\.alignment;', 'TextAnchor oldAlign = TextAnchor.UpperLeft;'
          Set-Content $p $t -NoNewline

      - name: Quitar blobs de arreglos
        working-directory: ref
        shell: python
        run: |
          import re
          p = r"src\ESPLogic.template.cs"
          src = open(p, encoding="utf-8").read()

          def conv(m):
              prefix, typ, name, body = m.group(1), m.group(2), m.group(3), m.group(4)
              items = [x.strip() for x in body.split(",") if x.strip()]
              out = "%snew %s[%d];\n" % (prefix, typ, len(items))
              for i, it in enumerate(items):
                  out += "                %s[%d] = %s;\n" % (name, i, it)
              return out

          src2, n = re.subn(r"(\b(string|int)\[\]\s+(\w+)\s*=\s*)\{([^{}]*)\};", conv, src)
          open(p, "w", encoding="utf-8").write(src2)
          print("arreglos convertidos:", n)

      - name: Quitar lambdas
        working-directory: ref
        shell: python
        run: |
          import re
          p = r"src\ESPLogic.template.cs"
          s = open(p, encoding="utf-8").read()

          helper = "\n".join([
            "        private static void DrawBoneSeg(Vector3 p1, Vector3 p2, Color c, float thick, Texture2D tex, int screenHeight)",
            "        {",
            "            if (p1.z > 0f && p2.z > 0f)",
            "            {",
            "                float x1 = p1.x, y1 = (float)screenHeight - p1.y, x2 = p2.x, y2 = (float)screenHeight - p2.y;",
            "                float dx = x2 - x1, dy = y2 - y1, len = Mathf.Sqrt(dx * dx + dy * dy);",
            "                if (len >= 0.5f)",
            "                {",
            "                    GUI.matrix = Matrix4x4.TRS(new Vector3(x1, y1, 0f), Quaternion.Euler(0f, 0f, Mathf.Atan2(dy, dx) * Rad2Deg), Vector3.one);",
            "                    GUI.color = new Color(c.r, c.g, c.b, 0.3f);",
            "                    GUI.DrawTexture(new Rect(0f, -1.0f, len, 2.0f), tex);",
            "                    GUI.color = c;",
            "                    GUI.DrawTexture(new Rect(0f, -thick * 0.5f, len, thick), tex);",
            "                    GUI.matrix = Matrix4x4.identity;",
            "                }",
            "            }",
            "        }",
            "",
            "        public static bool Bootstrap"
          ])

          s = s.replace("\n        public static bool Bootstrap", "\n" + helper, 1)
          s, a = re.subn(r"Action<Vector3, Vector3> DrawBone = \(p1, p2\) => \{.*?\};\n", "", s, flags=re.S)
          s, b = re.subn(r"DrawBone\((\w+), (\w+)\);", r"DrawBoneSeg(\1, \2, skelColor, c_skelThick, whiteTex, screenHeight);", s)
          open(p, "w", encoding="utf-8").write(s)
          print("lambda quitado:", a, "llamadas cambiadas:", b)

      - name: Compilar parche
        working-directory: ref
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Ver generador
        if: always()
        working-directory: ref
        shell: powershell
        run: |
          Write-Host "--- tools:"
          Get-ChildItem tools -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
          Write-Host "--- scripts llamados desde build.ps1:"
          Select-String -Path build.ps1 -Pattern '\.py|python' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "L$($_.LineNumber): $($_.Line.Trim())" }
          Write-Host "--- escritores:"
          Get-ChildItem -Recurse -Include *.py -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\(dist|generated)\\' } |
            Select-String -Pattern 'new class|new_class|def write|writer' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "$($_.Name):$($_.LineNumber): $($_.Line.Trim())" }

      - name: Subir
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parche
          path: |
            ref/dist/
            ref/generated/
          retention-days: 7

      - name: Publicar
        if: success()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload base ref\dist\Assembly-CSharp-patch.bytes --clobber --repo "$env:GITHUB_REPOSITORY"
          gh release view base --repo "$env:GITHUB_REPOSITORY"
