name: Parche

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Traer base
        run: git clone --depth 1 https://github.com/ttanhios1602-beep/3105-MENU.git ref

      - name: Ajustar scripts a python directo
        working-directory: ref
        shell: powershell
        run: |
          $t = Get-Content build.ps1 -Raw
          $t = $t -replace "'py'", "'python'"
          $t = $t -replace "'-3\.10', ", ""
          Set-Content build.ps1 $t -NoNewline
          Select-String -Path build.ps1 -Pattern "python" | Select-Object -First 5

      - name: Verificar csc
        shell: powershell
        run: |
          $p = 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $p)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $p) | Out-Null
            Copy-Item 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe' $p
          }
          & $p /? | Select-Object -First 1

      - name: Compilar parche
        working-directory: ref
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Subir
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parche
          path: |
            ref/dist/
            ref/generated/
          retention-days: 7
