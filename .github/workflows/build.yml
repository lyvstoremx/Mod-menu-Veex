- name: Inyectar
        run: |
          set -euo pipefail
          EXE="$APP/$(basename "$APP" .app)"
          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          python3 - "$APP" "$EXE" "$UF" <<'PY'
          import lief, os, sys
          app, exe, uf = sys.argv[1], sys.argv[2], sys.argv[3]
          keep = ("libil2cpp", "libmono", "libunity", "libveexcore", "unityframework",
                  "libswift", "libiphone", "libjs", "libtbb", "libc++", "libobjc",
                  "datadome", "libsystem")
          fw = os.path.join(app, "Frameworks")
          ufdir = os.path.join(fw, "UnityFramework.framework")

          muertos = set()
          for d in (fw, ufdir):
              if not os.path.isdir(d):
                  continue
              for n in sorted(os.listdir(d)):
                  if not n.endswith(".dylib"):
                      continue
                  if any(k in n.lower() for k in keep) and "veex" not in n.lower():
                      continue
                  try:
                      os.remove(os.path.join(d, n))
                      muertos.add(n)
                  except Exception as e:
                      print("no borre", n, e)
          print("archivos fuera:", sorted(muertos))

          for binario in (exe, uf):
              if not os.path.exists(binario):
                  print("no existe", binario)
                  continue
              print("=== revisando", binario)
              for _ in range(10):
                  b = lief.parse(binario)
                  print("  libs:", [l.name for l in b.libraries])
                  hit = []
                  for l in b.libraries:
                      base = os.path.basename(l.name)
                      if base in muertos or "veex" in l.name.lower():
                          hit.append(l.name)
                      elif base.endswith(".dylib") and not l.name.startswith("/usr/lib") \
                           and not l.name.startswith("/System") and not any(k in base.lower() for k in keep):
                          hit.append(l.name)
                  print("  quitar:", hit)
                  if not hit:
                      if binario == exe:
                          b.add_library("@executable_path/Frameworks/libveexcore.dylib")
                          b.write(binario)
                          print("  inyectado")
                      break
                  try:
                      b.remove_library(hit[0])
                  except Exception as e:
                      print("  no quite", hit[0], e)
                  b.write(binario)
          PY
          mkdir -p "$APP/Frameworks"
          cp out/libveexcore.dylib "$APP/Frameworks/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"
          ls -la "$APP/Frameworks/UnityFramework.framework" | head -30
