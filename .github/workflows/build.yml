name: Inspect

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ins:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Bajar base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p work
          gh release download base -D work || true
          ls -la work

      - name: Analizar
        run: |
          set -u
          F=$(find work -maxdepth 1 -iname '*.ipa' | head -1)
          echo "ipa: $F"
          test -n "$F" || { echo "sin ipa"; exit 1; }
          mkdir -p work/app
          unzip -q -o "$F" -d work/app
          APP=$(find work/app -maxdepth 3 -name '*.app' -type d | head -1)
          echo "app: $APP"
          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          {
            echo "=== CRYPTID"
            otool -l "$UF" | grep -A4 LC_ENCRYPTION_INFO | grep cryptid
            echo "=== DYLIBS"
            find "$APP" -iname '*.dylib' | sed 's|.*/||' | sort -u
            echo "=== LOAD"
            otool -L "$UF" | grep -vi '/usr/lib\|/System'
            echo "=== FRAMEWORKS"
            ls "$APP/Frameworks" 2>/dev/null
          } > work/report.txt 2>&1
          cat work/report.txt

      - name: Cadenas dylibs
        run: |
          set -u
          APP=$(find work/app -maxdepth 3 -name '*.app' -type d | head -1)
          : > work/keys.txt
          find "$APP" -iname '*.dylib' | while read -r D; do
            echo "=== $(basename "$D")" >> work/keys.txt
            strings -n 5 "$D" 2>/dev/null | grep -Eio 'keyauth|fluck|bypass|antiban|anti-ban|license|api\.[a-z0-9.-]+|https://[a-z0-9./-]{6,60}' | sort -u | head -40 >> work/keys.txt
          done
          head -120 work/keys.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect
          path: work/*.txt
