name: Veex

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: python3 -m pip install --quiet --break-system-packages requests lief

      - name: Base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download base --repo "$GITHUB_REPOSITORY" --pattern "com.dts.freefireth*.ipa" --dir work --clobber
          f=$(ls work/com.dts.freefireth*.ipa | head -1)
          mv "$f" work/base.ipa
          rm -f work/Veex.ipa work/Veex54.ipa
          ls -la work/base.ipa

      - name: Desempaquetar
        run: |
          set -euo pipefail
          cd work
          unzip -q base.ipa -d app
          cd ..
          APP=$(ls -d work/app/Payload/*.app | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          ls "$APP" | head -30

      - name: Compilar dylib
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -O2 -fobjc-arc \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=13.0 \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework Security -framework QuartzCore \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -Wl,-headerpad_max_install_names \
            -o out/libveexcore.dylib src/Veex.m
          xcrun -sdk iphoneos strip -x out/libveexcore.dylib
          ls -la out/

      - name: Entitlements
        run: |
          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint ent.plist

      - name: Inyectar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import lief, os
          app = os.environ["APP"]
          exe = os.path.join(app, os.path.basename(app).replace(".app", ""))
          bin_ = lief.parse(exe)
          bin_.add_library("@executable_path/Frameworks/libveexcore.dylib")
          bin_.write(exe)
          print("LC_LOAD_DYLIB añadido")
          PY
          mkdir -p "$APP/Frameworks"
          cp out/libveexcore.dylib "$APP/Frameworks/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"

      - name: Parche
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download base --repo "$GITHUB_REPOSITORY" --pattern "Assembly-CSharp-patch.bytes" --dir work --clobber
          cp work/Assembly-CSharp-patch.bytes "$APP/veexpatch.bin"
          ls -la "$APP/veexpatch.bin"

      - name: Firmar
        run: |
          set -euo pipefail
          rm -rf "$APP/_CodeSignature"
          find "$APP" -name "*.dylib" -exec codesign --force --sign - \
            --entitlements ent.plist --timestamp=none {} \;
          find "$APP/Frameworks" -maxdepth 1 -type f -name "*.dylib" \
            -exec codesign --force --sign - --entitlements ent.plist --timestamp=none {} \;
          codesign --force --deep --sign - --entitlements ent.plist --timestamp=none "$APP"
          codesign -dv --entitlements :- "$APP" 2>&1 | head -20
          codesign -v --deep --strict "$APP" && echo "firma OK"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app
          zip -qry ../../Veex.ipa Payload
          cd ../..
          unzip -l Veex.ipa | head -12
          ls -la Veex.ipa

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload base Veex.ipa --clobber --repo "$GITHUB_REPOSITORY"
          gh release view base --repo "$GITHUB_REPOSITORY"
