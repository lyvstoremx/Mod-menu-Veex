name: Prueba
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL del IPA (asset del Release)"
        required: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Bajar
        env:
          U: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p work
          curl -sSL "$U" -o work/base.ipa
          ls -la work/

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work && unzip -q base.ipa -d app
          APP="$PWD/app/Payload/$(ls app/Payload)"
          echo "APP=$APP" >> $GITHUB_ENV
          echo "TARGET=$APP/Frameworks/UnityFramework.framework/UnityFramework" >> $GITHUB_ENV

      - name: Compilar
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -o work/libveexcore.dylib src/Veex.m

      - name: Inyectar y firmar
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages lief
          test -f "$TARGET" || { echo "sin UnityFramework"; exit 1; }
          python3 -c "
          import lief, sys
          b = lief.parse(sys.argv[1]); b.add_library('libveexcore.dylib'); b.write(sys.argv[1])
          " "$TARGET"
          mkdir -p "$APP/Frameworks"
          cp work/libveexcore.dylib "$APP/Frameworks/"
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Frameworks/libveexcore.dylib"
          codesign --force --sign - "$APP/Frameworks/UnityFramework.framework"
          codesign --force --sign - "$APP"

      - name: Verificar
        run: |
          set -uo pipefail
          otool -L "$TARGET" | grep -i veex || echo "SIN LC_LOAD"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app && zip -qry ../../Veex.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
