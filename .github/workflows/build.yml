name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun -sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework Security \
            -framework CoreGraphics -framework QuartzCore \
            -O2 -fobjc-arc \
            -install_name @executable_path/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          ls -la out

      - name: Bajar IPA
        run: |
          set -u
          mkdir -p work
          PAGE=$(curl -sL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" "https://www.mediafire.com/file/od7voveps5u10c1/file")
          DIRECT=$(echo "$PAGE" | grep -o 'https://download[0-9]*\.mediafire\.com/[^"]*' | head -1) || true
          curl -L -A "Mozilla/5.0" "$DIRECT" -o work/ff.zip
          unzip -q -o work/ff.zip -d work/app || unzip -q -o work/ff.zip -d work/x
          find work -maxdepth 3 -name '*.app' -type d

      - name: Inyectar
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/Tyilo/insert_dylib.git /tmp/idl
          cd /tmp/idl && xcodebuild -quiet -configuration Release >/dev/null 2>&1
          IDL=$(find /tmp/idl -name insert_dylib -type f -perm +111 | head -1)
          APP=$(find "$GITHUB_WORKSPACE/work" -maxdepth 4 -name '*.app' -type d | head -1)
          FW="$APP/Frameworks/UnityFramework.framework"
          cp "$GITHUB_WORKSPACE/out/libveexcore.dylib" "$FW/libveexcore.dylib"
          cp "$GITHUB_WORKSPACE/out/libveexcore.dylib" "$APP/libveexcore.dylib"
          cp "$GITHUB_WORKSPACE/out/libveexcore.dylib" "$APP/Frameworks/libveexcore.dylib"
          "$IDL" --inplace --strip-codesig --all-yes "@executable_path/libveexcore.dylib" "$FW/UnityFramework"
          otool -L "$FW/UnityFramework" | grep veex

      - name: Analizar parche
        if: always()
        run: |
          set -u
          mkdir -p work/p
          curl -sL "https://tmpfiles.org/dl/1793768828.c0526b5215bf19aa/wxAlo8FzS5Aw/patch.bytes" -o work/p/patch.bytes || true
          ls -la work/p
          file work/p/patch.bytes
          xxd work/p/patch.bytes | head -5
          strings -n 4 work/p/patch.bytes | grep -Ei 'aim|head|esp|enemy|player|shoot|fire|bone|fov|damage|wall|name|hp' | sort -u | head -400 > work/p/claves.txt
          wc -l work/p/claves.txt
          head -80 work/p/claves.txt

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app
          zip -qry ../../Veex.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claves
          path: work/p/claves.txt
