name: Veex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Bajar
        run: |
          set -euo pipefail
          mkdir -p work out
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.ipa" --dir work --clobber
          stat -f "%z %N" work/*.ipa

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work
          F=$(ls -S *.ipa | tail -1)
          echo "USANDO: $F"
          ls -S *.ipa | tail -n +2 | xargs -r rm -f
          unzip -q "$F" -d app
          A="$PWD/app/Payload/$(ls app/Payload)"
          echo "APP=$A" >> $GITHUB_ENV
          echo "UF=$A/Frameworks/UnityFramework.framework/UnityFramework" >> $GITHUB_ENV
          ls -la "$A" | head

      - name: Compilar
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework Security \
            -framework CoreGraphics -framework QuartzCore \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          xcrun -sdk iphoneos strip -x out/libveexcore.dylib
          ls -la out/

      - name: Inyectar
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages lief
          cp "$UF" /tmp/uf.bak
          python3 -c 'import lief,sys;b=lief.parse(sys.argv[1]);b.add_library("libveexcore.dylib");b.write(sys.argv[1])' "$UF"
          cp out/libveexcore.dylib "$APP/Frameworks/"
          cp out/libveexcore.dylib "$APP/Frameworks/UnityFramework.framework/"
          cp out/libveexcore.dylib "$APP/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"

      - name: Verificar inyeccion
        run: |
          set -euo pipefail
          echo "--- tamano antes/despues ---"
          stat -f "%z" /tmp/uf.bak
          stat -f "%z" "$UF"
          echo "--- load commands ---"
          otool -L "$UF" | grep -i veex || { echo "NO QUEDO EL LC_LOAD_DYLIB"; exit 1; }
          echo "inyeccion ok"

      - name: Firmar
        run: |
          set -euo pipefail
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Frameworks/libveexcore.dylib"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/UnityFramework.framework"
          codesign --force --sign - --timestamp=none "$APP"

      - name: Verificar firma
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "$APP" && echo "firma ok"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app
          zip -qry ../../Veex.ipa Payload
          cd ../..
          unzip -l Veex.ipa | head -6
          ls -la Veex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
          retention-days: 7
