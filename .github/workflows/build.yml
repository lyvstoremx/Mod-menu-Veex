name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun -sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework Security \
            -O2 -fobjc-arc \
            -install_name @rpath/Monite.dylib \
            -o out/Monite.dylib src/Veex.m
          ls -la out

      - name: Bajar base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p work
          gh release download base -D work || true
          ls -la work

      - name: Reemplazar panel
        run: |
          set -u
          F=$(find work -maxdepth 1 -iname '*.ipa' | head -1)
          test -n "$F" || { echo "sin ipa"; exit 1; }
          unzip -q -o "$F" -d work/app
          APP=$(find work/app -maxdepth 3 -name '*.app' -type d | head -1)
          FW="$APP/Frameworks"
          cp out/Monite.dylib "$FW/Monite.dylib"
          echo "=== quien carga Monite ==="
          otool -L "$FW/UnityFramework.framework/UnityFramework" | grep -i monite || echo "no en UnityFramework"
          otool -L "$APP/FreeFire" | grep -i monite || echo "no en FreeFire"
          grep -ri monite "$APP/Info.plist" || echo "no en Info.plist"
          echo "=== dylibs en Frameworks ==="
          ls "$FW" | head -30

      - name: Recon IFix
        if: always()
        run: |
          set -u
          APP=$(find work/app -maxdepth 3 -name '*.app' -type d | head -1)
          : > work/recon.txt
          echo "=== patch/bytes ===" >> work/recon.txt
          find "$APP" -type f \( -iname '*patch*' -o -iname '*.bytes' -o -iname '*.dll' \) 2>/dev/null >> work/recon.txt
          echo "=== managed dirs ===" >> work/recon.txt
          find "$APP" -type d \( -iname '*managed*' -o -iname '*ifix*' \) 2>/dev/null >> work/recon.txt
          cat work/recon.txt

      - name: Empaquetar
        if: always()
        run: |
          set -u
          cd work/app || exit 0
          zip -qry ../../Veex.ipa Payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veex
          path: Veex.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recon
          path: work/recon.txt
