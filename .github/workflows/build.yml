name: Veex

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL directa del IPA (opcional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          U="${{ github.event.inputs.base_url }}"
          if [ -n "$U" ]; then
            echo "desde url"
            curl -sSL --retry 3 -o work/base.ipa "$U"
          else
            echo "desde release"
            gh release download base -p 'Veex54.ipa' -D work
            mv work/Veex54.ipa work/base.ipa
          fi
          ls -la work/base.ipa
          [ "$(head -c 2 work/base.ipa)" = "PK" ] || { echo "base invalida"; exit 1; }

      - name: Dependencias
        run: python3 -m pip install --quiet --break-system-packages lief

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work && unzip -q base.ipa -d app
          A="$(find app/Payload -maxdepth 1 -name '*.app' | head -1)"
          [ -n "$A" ] || { echo "sin .app"; exit 1; }
          echo "APP=$PWD/$A" >> $GITHUB_ENV

      - name: Compilar
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit \
            -framework QuartzCore -framework CoreGraphics \
            -framework CoreFoundation -framework Security \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          xcrun -sdk iphoneos strip -x out/libveexcore.dylib

      - name: Inyectar
        run: |
          set -euo pipefail
          EXE="$APP/$(basename "$APP" .app)"
          rm -f "$APP"/Frameworks/*eex*.dylib
          python3 -c "
          import lief,sys
          b=lief.parse(sys.argv[1])
          for lib in list(b.libraries):
              if 'veex' in lib.name.lower():
                  try: b.remove_library(lib.name)
                  except Exception as e: print('no se pudo quitar', e)
          b.add_library('@executable_path/Frameworks/libveexcore.dylib')
          b.write(sys.argv[1])
          print('inyectado limpio')
          " "$EXE"
          mkdir -p "$APP/Frameworks"
          cp out/libveexcore.dylib "$APP/Frameworks/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"

      - name: Parche
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh release download base -p 'Assembly-CSharp-patch.bytes' -D work 2>/dev/null || true
          if [ -f work/Assembly-CSharp-patch.bytes ]; then
            cp work/Assembly-CSharp-patch.bytes "$APP/"
          fi

      - name: Firmar
        run: |
          set -euo pipefail
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Frameworks/libveexcore.dylib"
          codesign --force --sign - "$APP"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app && zip -qry ../../Veex.ipa Payload
          cd ../..
          ls -la Veex.ipa

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload base Veex.ipa --clobber
