- name: Obtener base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p work
          URL="${{ github.event.inputs.base_url }}"
          if [ -n "$URL" ]; then
            echo "desde url"
            curl -sSL --retry 3 -o work/base.ipa "$URL"
          fi
          if [ ! -s work/base.ipa ]; then
            echo "desde release (Veex54)"
            gh release download base -p 'Veex54.ipa' -D work 2>/dev/null || true
            [ -f work/Veex54.ipa ] && mv work/Veex54.ipa work/base.ipa
          fi
          if [ ! -s work/base.ipa ]; then
            echo "desde release (cualquier ipa que no sea la salida)"
            gh release download base -p '*.ipa' -D work 2>/dev/null || true
            B="$(find work -maxdepth 1 -name '*.ipa' ! -name 'Veex.ipa' | head -1)"
            [ -n "$B" ] && mv "$B" work/base.ipa
          fi
          if [ ! -s work/base.ipa ]; then
            echo "desde mediafire"
            KEY="${{ github.event.inputs.ipa_key }}"
            python3 - "$KEY" <<'PY'
          import re, sys, requests
          key = sys.argv[1]
          UA = ("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1")
          s = requests.Session()
          s.headers.update({"User-Agent": UA, "Referer": "https://www.mediafire.com/"})
          for c in ["https://www.mediafire.com/download/%s/Veex30.ipa" % key,
                    "https://www.mediafire.com/download_repair.php?quick_key=%s" % key,
                    "https://www.mediafire.com/file/%s/file" % key]:
              try:
                  r = s.get(c, timeout=40)
                  m = re.search(r'https?://download[0-9]*\.mediafire\.com/[^"\'\s<>\\]+',
                                r.text.replace("\\/", "/"))
                  if m:
                      d = s.get(m.group(0), stream=True, timeout=900)
                      d.raise_for_status()
                      with open("work/base.ipa", "wb") as f:
                          for x in d.iter_content(1 << 16):
                              f.write(x)
                      break
              except Exception as e:
                  print("%s -> %s" % (c, e))
          PY
          fi
          ls -la work/
          head -c 2 work/base.ipa | grep -q PK || { echo "base invalida"; exit 1; }
          echo "base ok"
