name: Oficial
on:
  workflow_dispatch:
    inputs:
      apple_pass:
        description: "contrasena del Apple ID"
        required: true
      auth_code:
        description: "codigo 2FA (vacio en el primer intento)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ipatool
        run: brew install majd/ipatool/ipatool

      - name: Login y descarga
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ inputs.apple_pass }}
          AUTH: ${{ inputs.auth_code }}
        run: |
          set -uo pipefail
          mkdir -p work
          ipatool auth login -e "$APPLE_ID" -p "$APPLE_PASS" ${AUTH:+--auth-code $AUTH} || {
            echo "=== si pide 2FA, ya te llego el codigo: vuelve a correr con el ==="; exit 1; }
          ipatool purchase -b com.dts.freefireth || true
          ipatool download -b com.dts.freefireth -o work/base.ipa || exit 1
          ls -la work/

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work && unzip -q base.ipa -d app
          APP=$(ls -d "$PWD"/app/Payload/*.app | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          echo "TARGET=$APP/Frameworks/UnityFramework.framework/UnityFramework" >> $GITHUB_ENV

      - name: Compilar
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation -framework Security \
            -install_name @executable_path/Frameworks/libhlslcc.dylib \
            -o work/libhlslcc.dylib src/Veex.m

      - name: Inyectar
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Tyilo/insert_dylib /tmp/idl
          SRC=$(find /tmp/idl -name "main.c" | head -1)
          clang -o /tmp/insert_dylib "$SRC"
          /tmp/insert_dylib --inplace --strip-codesig \
            "@executable_path/Frameworks/libhlslcc.dylib" "$TARGET"
          mkdir -p "$APP/Frameworks"
          cp work/libhlslcc.dylib "$APP/Frameworks/"
          rm -rf "$APP/_CodeSignature"
          rm -rf "$APP/Frameworks/UnityFramework.framework/_CodeSignature"

      - name: Verificar cifrado
        run: |
          set -uo pipefail
          echo "== cryptid (debe ser 1) =="
          otool -l "$TARGET" | grep -A5 LC_ENCRYPTION_INFO | grep -E "cryptid|cryptoff" || echo "SIN LC_ENCRYPTION_INFO"
          otool -L "$TARGET" | grep -i hlslcc || echo "SIN LC_LOAD"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app && zip -qry ../../Veex.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
