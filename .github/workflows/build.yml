name: Veex

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL del IPA base (asset del Release)"
        required: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Bajar
        env:
          U: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p work out
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$U" -o work/base.ipa
          ls -la work/

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work && unzip -q base.ipa -d app
          echo "APP=$PWD/app/Payload/$(ls app/Payload)" >> $GITHUB_ENV

      - name: Compilar
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework Security \
            -framework CoreGraphics -framework QuartzCore \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          xcrun -sdk iphoneos strip -x out/libveexcore.dylib
          ls -la out/

      - name: Inyectar
        run: |
          set -euo pipefail
          python3 -m pip install --quiet lief
          python3 - <<'PY'
          import lief, os
          app = os.environ["APP"]
          uf = os.path.join(app, "Frameworks/UnityFramework.framework/UnityFramework")
          b = lief.parse(uf)
          b.add_library("libveexcore.dylib")
          b.write(uf)
          print("LC_LOAD_DYLIB en UnityFramework")
          PY
          cp out/libveexcore.dylib "$APP/Frameworks/"
          cp out/libveexcore.dylib "$APP/Frameworks/UnityFramework.framework/"
          cp out/libveexcore.dylib "$APP/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"

      - name: Firmar
        run: |
          set -euo pipefail
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Frameworks/libveexcore.dylib"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/UnityFramework.framework"
          codesign --force --sign - --timestamp=none "$APP"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work && zip -qry ../Veex.ipa app
          cd .. && ls -la Veex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
          retention-days: 7
