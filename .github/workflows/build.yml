name: Veex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT: "*.ipa"

    steps:
      - uses: actions/checkout@v4

      - name: Bajar
        run: |
          set -euo pipefail
          mkdir -p work out
          echo "patron: $PAT"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "$PAT" --dir work --clobber
          ls -la work/
          N=$(ls work/*.ipa | wc -l | tr -d ' ')
          echo "encontradas: $N"
          if [ "$N" -ne 1 ]; then
            echo "hay $N, me quedo con la mas nueva"
            ls -t work/*.ipa | tail -n +2 | xargs -r rm -f
          fi
          ls -la work/

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work
          F=$(ls *.ipa | head -1)
          echo "USANDO: $F"
          unzip -q "$F" -d app
          echo "APP=$PWD/app/Payload/$(ls app/Payload)" >> $GITHUB_ENV

      - name: Compilar
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework Security \
            -framework CoreGraphics -framework QuartzCore \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          xcrun -sdk iphoneos strip -x out/libveexcore.dylib
          ls -la out/

      - name: Inyectar
        run: |
          set -euo pipefail
          python3 -m pip install --quiet lief
          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          python3 -c 'import lief,sys;b=lief.parse(sys.argv[1]);b.add_library("libveexcore.dylib");b.write(sys.argv[1])' "$UF"
          cp out/libveexcore.dylib "$APP/Frameworks/"
          cp out/libveexcore.dylib "$APP/Frameworks/UnityFramework.framework/"
          cp out/libveexcore.dylib "$APP/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"

      - name: Firmar
        run: |
          set -euo pipefail
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Frameworks/libveexcore.dylib"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/UnityFramework.framework"
          codesign --force --sign - --timestamp=none "$APP"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work && zip -qry ../Veex.ipa app
          cd .. && ls -la Veex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
          retention-days: 7
