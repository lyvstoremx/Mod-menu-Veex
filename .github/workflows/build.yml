name: Veex

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Apple ID password"
        required: true
      auth_code:
        description: "Codigo 2FA (dejalo vacio en el primer intento)"
        required: false
        default: ""
      ipa_url:
        description: "IPA de respaldo (opcional, si ipatool falla)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Compilar dylib
        run: |
          set -euo pipefail
          mkdir -p out
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=13.0 \
            -framework UIKit -framework Foundation -framework Security \
            -O2 -fobjc-arc \
            -install_name @executable_path/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          ls -la out

      - name: Instalar ipatool
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP/ipa"
          ASSET=$(curl -sL https://api.github.com/repos/majd/ipatool/releases/latest \
            | grep -o '"browser_download_url":[^,]*' \
            | grep -i macos | grep -i arm64 | head -1 \
            | sed 's/.*"\(https[^"]*\)".*/\1/') || true
          echo "asset: $ASSET"
          if [ -z "${ASSET:-}" ]; then
            echo "no se encontro asset arm64, probando amd64"
            ASSET=$(curl -sL https://api.github.com/repos/majd/ipatool/releases/latest \
              | grep -o '"browser_download_url":[^,]*' \
              | grep -i macos | head -1 \
              | sed 's/.*"\(https[^"]*\)".*/\1/') || true
          fi
          echo "asset final: $ASSET"
          curl -sL "$ASSET" -o ipatool.tar.gz
          tar xzf ipatool.tar.gz
          BIN=$(find . -type f -name ipatool | head -1)
          echo "bin: $BIN"
          chmod +x "$BIN"
          "$BIN" --version
          echo "$RUNNER_TEMP/ipa" >> "$GITHUB_PATH"

      - name: Login
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PW: ${{ inputs.password }}
          APPLE_CODE: ${{ inputs.auth_code }}
        run: |
          set -u
          if [ -n "${APPLE_CODE:-}" ]; then
            ipatool auth login -e "$APPLE_ID" -p "$APPLE_PW" --auth-code "$APPLE_CODE" --non-interactive || true
          else
            ipatool auth login -e "$APPLE_ID" -p "$APPLE_PW" --non-interactive || true
          fi

      - name: Descargar IPA oficial
        run: |
          set -u
          mkdir -p work
          ipatool download -b com.dts.freefireth -o "$PWD/work/ff.ipa" --non-interactive || true
          if [ ! -f work/ff.ipa ] && [ -n "${{ inputs.ipa_url }}" ]; then
            echo "ipatool fallo, usando respaldo"
            curl -L -A "Mozilla/5.0" "${{ inputs.ipa_url }}" -o work/ff.ipa
          fi
          ls -la work
          file work/ff.ipa

      - name: Verificar cifrado
        run: |
          set -u
          cd work
          unzip -q ff.ipa -d app
          APP=$(ls -d "$PWD"/app/Payload/*.app | head -1)
          echo "app: $APP"
          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          test -f "$UF" || { echo "sin UnityFramework"; exit 1; }
          otool -l "$UF" | grep -A4 LC_ENCRYPTION_INFO | grep cryptid

      - name: Inyectar
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone -q --depth 1 https://github.com/Tyilo/insert_dylib.git /tmp/idl
          cd /tmp/idl && xcodebuild -quiet -configuration Release >/dev/null 2>&1
          IDL=$(find /tmp/idl -name insert_dylib -type f -perm +111 | head -1)
          APP=$(ls -d "$GITHUB_WORKSPACE"/work/app/Payload/*.app | head -1)
          UF="$APP/Frameworks/UnityFramework.framework/UnityFramework"
          cp "$GITHUB_WORKSPACE/out/libveexcore.dylib" "$APP/Frameworks/UnityFramework.framework/libveexcore.dylib"
          "$IDL" --inplace --strip-codesig --all-yes "@executable_path/libveexcore.dylib" "$UF"
          otool -L "$UF" | grep veexcore
          otool -l "$UF" | grep -A4 LC_ENCRYPTION_INFO | grep cryptid

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app
          zip -qry ../../Veex.ipa Payload
          cd ../..
          ls -la Veex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
