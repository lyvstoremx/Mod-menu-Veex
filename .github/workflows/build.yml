name: Veex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Bajar
        run: |
          set -euo pipefail
          mkdir -p work out
          python3 -m pip install --quiet --break-system-packages requests
          python3 - <<'PY'
          import re, sys, time, requests

          QK = "od7voveps5u10c1"
          DK = "4o62ssbfdpf"
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/126.0 Safari/537.36",
               "Accept": "text/html,application/xhtml+xml,*/*",
               "Referer": "https://www.mediafire.com/"}

          PATS = [
              r'https?://download[0-9]*\.mediafire\.com/[^"\'\s<>\\]+',
              r'//download[0-9]*\.mediafire\.com/[^"\'\s<>\\]+',
              r'https?://[a-z0-9.]*mediafire\.com/[^"\'\s<>\\]*\.ipa[^"\'\s<>\\]*',
          ]

          def find(html):
              h = html.replace("\\/", "/").replace("&amp;", "&")
              for p in PATS:
                  m = re.search(p, h)
                  if m:
                      u = m.group(0)
                      return u if u.startswith("http") else "https:" + u
              return None

          link = None

          print("1) repair")
          for i in range(3):
              try:
                  r = requests.get("https://www.mediafire.com/dynamic/download_repair.php",
                                   params={"qkey": QK, "dkey": DK}, headers=H, timeout=40)
                  print("   %d bytes" % len(r.text))
                  link = find(r.text)
                  if link: break
              except Exception as e:
                  print("   %s" % e)
              time.sleep(4)

          if not link:
              print("2) pagina")
              for i in range(5):
                  try:
                      r = requests.get("https://www.mediafire.com/file/%s/file" % QK,
                                       headers=H, timeout=40)
                      print("   %d bytes" % len(r.text))
                      link = find(r.text)
                      if link: break
                  except Exception as e:
                      print("   %s" % e)
                  time.sleep(4)

          if not link:
              print("3) api")
              try:
                  r = requests.get("https://www.mediafire.com/api/1.5/file/get_links.php",
                                   params={"quick_key": QK, "link_type": "direct_download",
                                           "response_format": "json"}, headers=H, timeout=40)
                  print("   %s" % r.text[:300])
                  j = r.json()
                  link = j["response"]["links"][0]["direct_download"]
              except Exception as e:
                  print("   %s" % e)

          if not link:
              print("SIN ENLACE")
              sys.exit(1)

          print("enlace: %s" % link.split("?")[0])
          r = requests.get(link, headers=H, timeout=1200, stream=True)
          r.raise_for_status()
          n = 0
          with open("work/base.ipa", "wb") as f:
              for c in r.iter_content(1 << 16):
                  f.write(c); n += len(c)
          print("bajado: %d bytes" % n)
          if n < 300_000_000:
              print("MUY CHICO"); sys.exit(1)
          with open("work/base.ipa", "rb") as f:
              if f.read(2) != b"PK":
                  print("NO ES UN ZIP"); sys.exit(1)
          print("ok")
          PY
          ls -la work/

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work
          unzip -q base.ipa -d app
          A="$PWD/app/Payload/$(ls app/Payload)"
          echo "APP=$A" >> $GITHUB_ENV
          echo "UF=$A/Frameworks/UnityFramework.framework/UnityFramework" >> $GITHUB_ENV
          ls -la "$A" | head

      - name: Compilar
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework Security \
            -framework CoreGraphics -framework QuartzCore \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          xcrun -sdk iphoneos strip -x out/libveexcore.dylib
          ls -la out/

      - name: Inyectar
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages lief
          python3 -c 'import lief,sys;b=lief.parse(sys.argv[1]);b.add_library("libveexcore.dylib");b.write(sys.argv[1])' "$UF"
          cp out/libveexcore.dylib "$APP/Frameworks/"
          cp out/libveexcore.dylib "$APP/Frameworks/UnityFramework.framework/"
          cp out/libveexcore.dylib "$APP/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"

      - name: Verificar
        run: |
          set -euo pipefail
          otool -L "$UF" | grep -i veex || { echo "NO QUEDO EL LC_LOAD_DYLIB"; exit 1; }
          echo "inyeccion ok"

      - name: Firmar
        run: |
          set -euo pipefail
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Frameworks/libveexcore.dylib"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/UnityFramework.framework"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app
          zip -qry ../../Veex.ipa Payload
          cd ../..
          unzip -l Veex.ipa | head -6
          ls -la Veex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
          retention-days: 7
