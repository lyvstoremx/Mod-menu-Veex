name: Veex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Bajar
        run: |
          set -euo pipefail
          mkdir -p work out
          python3 -m pip install --quiet --break-system-packages requests
          python3 - <<'PY'
          import re, sys, time, requests

          URL = "https://www.mediafire.com/file/od7voveps5u10c1/file"
          H = {"User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                             "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"}
          PAT = r'https?://download[0-9]*\.mediafire\.com/[^"\'\s<>\\]+'

          link = None
          for i in range(8):
              try:
                  r = requests.get(URL, headers=H, timeout=40)
                  print("pagina %d: %d bytes" % (i + 1, len(r.text)))
                  m = re.search(PAT, r.text.replace("\\/", "/"))
                  if m:
                      link = m.group(0); break
              except Exception as e:
                  print("intento %d: %s" % (i + 1, e))
              time.sleep(5)
          if not link:
              print("sin enlace"); sys.exit(1)
          print("ok")
          r = requests.get(link, headers=H, timeout=900, stream=True)
          r.raise_for_status()
          with open("work/base.ipa", "wb") as f:
              for c in r.iter_content(1 << 16): f.write(c)
          PY
          ls -la work/

      - name: Desempacar
        run: |
          set -euo pipefail
          cd work
          unzip -q base.ipa -d app
          A="$PWD/app/Payload/$(ls app/Payload)"
          echo "APP=$A" >> $GITHUB_ENV
          echo "UF=$A/Frameworks/UnityFramework.framework/UnityFramework" >> $GITHUB_ENV
          ls -la "$A" | head

      - name: Compilar
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework UIKit -framework Security \
            -framework CoreGraphics -framework QuartzCore \
            -install_name @executable_path/Frameworks/libveexcore.dylib \
            -o out/libveexcore.dylib src/Veex.m
          xcrun -sdk iphoneos strip -x out/libveexcore.dylib
          ls -la out/

      - name: Inyectar
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages lief
          cp "$UF" /tmp/uf.bak
          python3 -c 'import lief,sys;b=lief.parse(sys.argv[1]);b.add_library("libveexcore.dylib");b.write(sys.argv[1])' "$UF"
          cp out/libveexcore.dylib "$APP/Frameworks/"
          cp out/libveexcore.dylib "$APP/Frameworks/UnityFramework.framework/"
          cp out/libveexcore.dylib "$APP/"
          chmod +x "$APP/Frameworks/libveexcore.dylib"

      - name: Verificar
        run: |
          set -euo pipefail
          otool -L "$UF" | grep -i veex || { echo "NO QUEDO EL LC_LOAD_DYLIB"; exit 1; }
          echo "inyeccion ok"

      - name: Firmar
        run: |
          set -euo pipefail
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - "$APP/Frameworks/libveexcore.dylib"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/UnityFramework.framework"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Empaquetar
        run: |
          set -euo pipefail
          cd work/app
          zip -qry ../../Veex.ipa Payload
          cd ../..
          unzip -l Veex.ipa | head -6
          ls -la Veex.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Veex
          path: Veex.ipa
          retention-days: 7
