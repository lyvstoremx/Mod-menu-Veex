- name: Base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p work
          gh release download base -p '*und3fined*.ipa' -D work 2>/dev/null || true
          F="$(find work -maxdepth 1 -name '*und3fined*.ipa' | head -1)"
          if [ -n "$F" ]; then mv "$F" work/base.ipa; echo "desde release"; fi
          if [ ! -s work/base.ipa ] || [ "$(head -c 2 work/base.ipa)" != "PK" ]; then
            echo "uso Veex54"
            rm -f work/base.ipa
            gh release download base -p 'Veex54.ipa' -D work
            mv work/Veex54.ipa work/base.ipa
          fi
          ls -la work/base.ipa
