name: Claves

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL del parche"
        required: true

jobs:
  k:
    runs-on: macos-15
    steps:
      - name: Bajar y filtrar
        env:
          U: ${{ inputs.url }}
        run: |
          set -u
          mkdir -p p
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$U" -o p/patch.bytes
          SZ=$(stat -f%z p/patch.bytes)
          echo "tamano: $SZ"
          if [ "$SZ" -lt 1000000 ]; then echo "CHICO, es HTML o basura"; file p/patch.bytes; exit 1; fi
          xxd -l 16 p/patch.bytes
          strings -n 4 p/patch.bytes > p/all.txt || true
          wc -l p/all.txt
          grep -E '^(get_|set_)[A-Za-z]+' p/all.txt | sort -u > p/acc.txt || true
          grep -Ei '^(Aim|Fire|Shoot|Player|Enemy|Team|Health|Hp|Head|Bone|Camera|Reload|Move|Jump|Spawn|Damage|Weapon|Gun|Bullet|Entity|Actor|Char|CrossHair)' p/all.txt | sort -u > p/cls.txt || true
          wc -l p/acc.txt p/cls.txt
          head -80 p/cls.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claves2
          path: p/*.txt
